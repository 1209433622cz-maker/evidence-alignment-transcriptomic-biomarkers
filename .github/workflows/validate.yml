name: Validate public release

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate integrity, aggregate-only boundary, and frozen results
        run: python 2_code/validate_public_release.py
      - name: Validate current RPv5 resource and truthful declarations
        run: python 2_code/validate_rpv5_release.py

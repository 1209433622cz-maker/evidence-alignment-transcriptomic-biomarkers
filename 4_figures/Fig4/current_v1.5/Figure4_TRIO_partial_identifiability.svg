  <g id="text_33">
   <text style="font-size: 6px; font-family: 'Arial'; text-anchor: start" x="20.749606" y="319.608" transform="rotate(-0 20.749606 319.608)">Conditional on the public Arm 3 set being a subset of the reported combined arm with the same pCR definition.</text>
  </g>

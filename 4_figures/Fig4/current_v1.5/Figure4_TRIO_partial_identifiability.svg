   <g id="text_31">
    <text style="font-size: 7px; font-family: 'Arial'" transform="translate(287.382047 219.577115)">Missing: joint phase–marker–outcome mapping</text>
    <text style="font-size: 7px; font-family: 'Arial'" transform="translate(287.382047 228.816623)">Retain all ten historical comparisons</text>
    <text style="font-size: 7px; font-family: 'Arial'" transform="translate(287.382047 238.106334)">Do not fit a pseudo-corrected randomized interaction</text>
   </g>
   <g id="text_32">

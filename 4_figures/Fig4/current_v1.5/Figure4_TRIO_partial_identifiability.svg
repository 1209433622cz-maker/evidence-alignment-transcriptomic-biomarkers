   <text style="font-size: 6px; font-family: 'Arial'; text-anchor: start" x="20.749606" y="326.8944" transform="rotate(-0 20.749606 326.8944)">Dots are feasible counts, not participants. The compatibility range is neither a CI nor a treatment-effect bound.</text>

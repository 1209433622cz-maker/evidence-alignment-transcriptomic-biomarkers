    <text style="font-size: 6px; font-family: 'Arial'" transform="translate(114.122835 241.886724)">30-38 randomized participants</text>
    <text style="font-size: 6px; font-family: 'Arial'" transform="translate(114.122835 249.849333)">Raw pCR proportion: 48.5-60.0%</text>
   </g>
   <g id="text_33">
    <text style="font-size: 6px; font-family: 'Arial'" transform="translate(312.540945 233.866411)">Unresolved: phase-marker-outcome mapping</text>
    <text style="font-size: 6px; font-family: 'Arial'" transform="translate(312.540945 241.899333)">Historical comparison: allocation phase unverified</text>
    <text style="font-size: 6px; font-family: 'Arial'" transform="translate(312.540945 249.861942)">No pseudo-corrected participant subset is fitted</text>
   </g>
   <g id="text_34">
    <text style="font-size: 7px; font-family: 'Arial'; text-anchor: start" x="114.122835" y="209.513844" transform="rotate(-0 114.122835 209.513844)">Missing joint identity prevents a corrected biomarker interaction</text>
   </g>
  </g>
  <g id="text_35">
   <text style="font-size: 5.7px; font-family: 'Arial'; text-anchor: start" x="23.343307" y="342.521575" transform="rotate(-0 23.343307 342.521575)">Assumption: public Arm 3 is a subset of the reported combined arm, with the same endpoint definition.</text>
